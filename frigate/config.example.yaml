# ===========================================================================
#  Frigate NVR — конфигурация системы мониторинга
#  engineer-against-dementia
# ===========================================================================
#
#  Скопируй в config.yaml и подставь свои значения:
#      cp config.example.yaml config.yaml
#
#  Пароли и логины НЕ пишутся сюда напрямую. Frigate подставляет переменные
#  окружения вида {FRIGATE_*} — см. .env.example и docker-compose.yml.
#  Подстановка работает ТОЛЬКО там, где она разрешена в reference config
#  (mqtt.host/user/password, ffmpeg.inputs.path и ещё несколько полей).
#  https://docs.frigate.video/configuration/
#
#  Координаты зон и масок здесь — от конкретной установки. Свои рисуй в UI:
#  Settings -> Mask & Zone Editor. Переносить чужие бессмысленно.
# ===========================================================================

version: 0.17-0

# ---------------------------------------------------------------------------
#  MQTT — шина между Frigate и Home Assistant
#  Брокер (Mosquitto) стоит как add-on внутри HA.
# ---------------------------------------------------------------------------
mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# ---------------------------------------------------------------------------
#  МОДЕЛЬ ДЕТЕКЦИИ
#
#  YOLOv9-s @ 320×320 в ONNX. Собирается из models/yolov9/Dockerfile.
#
#  ВАЖНО: веса брать ТОЛЬКО из релиза с суффиксом `-converted.pt`.
#  Обычные `.pt` дают несовместимый формат выходного тензора, и
#  post_process_yolo во Frigate молча возвращает пустой результат —
#  детекция «работает», но не находит ничего.
#
#  Почему -s, а не -t: yolov9-t пропускал человека в сложных позах
#  (лёжа на диване, частично под одеялом, закрыт мебелью).
# ---------------------------------------------------------------------------
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt

detectors:
  onnx:
    type: onnx

# ---------------------------------------------------------------------------
#  РАСПОЗНАВАНИЕ ЛИЦ
#
#  Пороги подобраны эмпирически под съёмку с дистанции и под углом.
#  Значения по умолчанию у Frigate заметно мягче и путали членов семьи.
#
#  detection_threshold  — насколько уверенно найдено само лицо
#  recognition_threshold— насколько уверенно оно сопоставлено с известным
#  unknown_score        — ниже этого порога человек помечается как «неизвестный»
#  min_area             — лица мельче не пытаться распознавать (мусорные срабатывания)
#  min_faces            — сколько кадров подряд нужно, чтобы присвоить имя
#  blur_confidence_filter — штрафовать смазанные кадры
#
#  Дисциплина базы важнее порогов: 20-50 качественных фото на человека
#  работают лучше, чем 500 случайных. См. docs/ru/06-ai-models.md
# ---------------------------------------------------------------------------
face_recognition:
  enabled: true
  model_size: large
  detection_threshold: 0.75
  min_area: 2000
  recognition_threshold: 0.87
  unknown_score: 0.78
  min_faces: 2
  save_attempts: 500
  blur_confidence_filter: true

# ---------------------------------------------------------------------------
#  FFMPEG — аппаратное декодирование
#  preset-nvidia для NVIDIA GPU. Для Raspberry Pi 5 замени на preset-rpi-64-h264,
#  для Intel iGPU — preset-vaapi.
# ---------------------------------------------------------------------------
ffmpeg:
  hwaccel_args: preset-nvidia

# ---------------------------------------------------------------------------
#  ЗАПИСЬ
#  7 дней хранения по движению. Больше — упирается в диск и в смысл:
#  разбирать инцидент старше недели всё равно никто не будет.
# ---------------------------------------------------------------------------
record:
  enabled: true
  alerts:
    retain:
      days: 7
      mode: motion
  detections:
    retain:
      days: 7
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

# ---------------------------------------------------------------------------
#  КЛАССИФИКАЦИЯ ПО ВНЕШНЕМУ ВИДУ (Frigate 0.17+)
#
#  Страховка на случай, когда лица не видно: силуэт, одежда, походка.
#  classification_type: attribute — принципиально важно. При типе `sub_label`
#  результат конфликтует с face_recognition, которая пишет в то же поле.
#
#  СТАТУС: экспериментально. После добавления этой секции Frigate отвечал 502
#  на auth-эндпоинте. Не диагностировано до конца — см. docs/ru/07-troubleshooting.md
#  Если ловишь 502 — закомментируй весь блок и перезапусти контейнер.
# ---------------------------------------------------------------------------
classification:
  custom:
    person_by_appearance:
      threshold: 0.75
      object_config:
        objects: [person]
        classification_type: attribute

# ---------------------------------------------------------------------------
#  КАМЕРЫ
#
#  Регистр имён зон ИМЕЕТ ЗНАЧЕНИЕ. Зона `Exit` и строка `exit` в шаблоне
#  Home Assistant — разные вещи. В автоматизациях HA приводи к нижнему
#  регистру через map('lower'), иначе триггер молча не сработает.
# ---------------------------------------------------------------------------
cameras:

  # --- Двор: контроль ухода из дома -----------------------------------------
  yard_cam:
    ffmpeg:
      inputs:
        # Отдельные потоки под detect и record: детекции нужен низкий
        # latency, записи — полный битрейт. На одном потоке одно мешает другому.
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD_YARD}@CAMERA_IP:554/h264/ch1/main/av_stream
          roles:
            - detect
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD_YARD}@CAMERA_IP:554/h264/ch1/main/av_stream
          roles:
            - record
    detect:
      enabled: true
      width: 2592
      height: 1440
      fps: 8
      annotation_offset: 0
      stationary:
        threshold: 5
    objects:
      track:
        - person
      filters:
        person:
          min_score: 0.6
          threshold: 0.7
          min_area: 500
      # Маска: улица за забором, соседский двор, крона дерева.
      # Без неё прохожие с тротуара генерируют тревоги круглые сутки.
      mask: 0.162,0.997,0.409,0.2,0.457,0.21,0.469,0.087,0.646,0.18,0.754,0.227,0.788,0.207,0.802,0.011,0.437,0.003,0.005,0.008,0.006,0.991
    zones:
      # Крыльцо / вход в дом — «человек вернулся»
      home:
        coordinates: 0.794,0.615,0.895,0.992,1,0.998,0.995,0.684,0.895,0.417,0.851,0.596
        inertia: 3
        loitering_time: 0
      # Двор — «вышел, но ещё на территории». Тревоги не даёт.
      yard:
        coordinates: 0.376,0.443,0.486,0.456,0.525,0.322,0.745,0.448,0.774,0.509,0.816,0.609,0.771,0.611,0.772,0.65,0.788,0.732,0.866,1,0.2,0.997,0.163,1,0.265,0.661,0.318,0.481,0.353,0.368
        inertia: 1
        loitering_time: 0
        objects: person
        friendly_name: Yard
      # Калитка — ЭТО тревога. inertia: 1, потому что нужна мгновенная реакция:
      # человек с деменцией проходит калитку за секунды.
      Exit:
        coordinates: 0.344,0.438,0.497,0.463,0.512,0.316,0.448,0.293,0.454,0.214,0.409,0.208,0.384,0.279
        inertia: 1
        loitering_time: 0
        objects: person
    review:
      alerts:
        required_zones: Exit

  # --- Комнаты: контроль ночной активности ----------------------------------
  indoor_cam:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD_INDOOR}@CAMERA_IP:554/h264/ch1/main/av_stream
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 2560
      height: 1440
      fps: 5
      stationary:
        threshold: 5
    objects:
      track:
        - person
      filters:
        person:
          # Выше, чем на дворовой: в помещении много ложных срабатываний
          # на мебель, отражения и тени.
          min_score: 0.8
          threshold: 0.7
          min_area: 500
      mask: 0.792,0.88,0.692,0.836,0.715,0.207,0.279,0.158,0.277,0.08,0.714,0.021,0.962,0.073,0.958,0.33,0.89,0.438,0.838,0.576,0.789,0.631,0.86,0.68
    zones:
      # Статичная карта «камера -> комната». Это принципиально:
      # определять комнату должна конфигурация, а не нейросеть.
      bed:
        coordinates: 0.036,0.826,0.314,0.65,0.174,0.489,0.17,0.381,0,0.454,0.005,0.585,0.003,0.737
        loitering_time: 0
        objects: person
        friendly_name: Bed
        inertia: 3
      bedroom:
        coordinates: 0.168,0.39,0.286,0.352,0.298,0.474,0.418,0.645,0.669,0.83,0.972,0.97,0.979,1,0.323,1,0.26,0.848,0.339,0.787,0.332,0.641,0.288,0.623,0.3,0.63,0.181,0.5
        loitering_time: 0
        objects: person
        friendly_name: Bedroom
        inertia: 3
      kitchen:
        coordinates: 0.791,0.888,0.789,0.893,0.863,0.68,0.789,0.631,0.833,0.585,1,0.689,1,1
        loitering_time: 0
        objects: person
        friendly_name: Kitchen
        inertia: 3
