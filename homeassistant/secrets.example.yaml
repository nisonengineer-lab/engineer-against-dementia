# ===========================================================================
#  Скопировать в secrets.yaml в конфиге Home Assistant.
#  secrets.yaml НИКОГДА не коммитится.
# ===========================================================================

# Telegram-бот: токен от @BotFather
telegram_bot_token: "000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

# chat_id получателей тревог. Узнать можно, написав боту и посмотрев
# https://api.telegram.org/bot<ТОКЕН>/getUpdates
telegram_chat_id_primary: 000000000
telegram_chat_id_secondary: 000000000

# MQTT (add-on Mosquitto)
mqtt_user: changeme
mqtt_password: changeme

# IP хоста, с которого приходит трафик Cloudflare Tunnel
trusted_proxy_host: 10.0.0.X
